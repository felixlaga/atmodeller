name: Weekly

# Tests the newest dependency releases that pyproject.toml allows, which is what users get from
# PyPI. CI tests the versions locked in uv.lock, so this catches upstream breakage (e.g. a new JAX
# or Equinox release) within a week.

on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"

      # --upgrade resolves the newest allowed versions instead of those in uv.lock
      - name: Install the project with the latest dependencies
        run: uv sync --upgrade --all-extras --dev

      - name: Show the versions tested
        run: uv pip list | grep -iE "^(jax|jaxlib|equinox|optimistix|lineax|numpy|scipy) "

      - name: Run tests
        run: uv run pytest -m "not performance" --durations=20
