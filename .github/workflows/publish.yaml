name: Publish on PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The full CI (pre-commit and tests on every platform) must pass before publishing
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    # Settings > Environments > release can require a manual approval before publishing
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # The same uv version as used to write uv.lock
          version: "0.12.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build
        run: uv build

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Publish
        run: uv publish
